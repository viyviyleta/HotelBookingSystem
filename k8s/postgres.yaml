apiVersion: apps/v1
kind: Deployment
metadata:
  name: riot-db
  labels:
    app: riot-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: riot-db
  template:
    metadata:
      labels:
        app: riot-db
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: hotelbooking
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: riot-db-secret
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "hotelbooking"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: riot-db
  labels:
    app: riot-db
spec:
  type: ClusterIP
  selector:
    app: riot-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
